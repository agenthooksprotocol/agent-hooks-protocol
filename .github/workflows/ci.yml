name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test snapshot checker
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover tools/tests
      - name: Validate protocol snapshots
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/check_conformance.py --all
