name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test snapshot checker
        run: python3 -m unittest discover tools/tests
      - name: Validate draft snapshot
        run: python3 tools/check_conformance.py
      - name: Validate frozen snapshots
        shell: bash
        run: |
          set -euo pipefail
          exact_semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          snapshots=()

          for root in spec schema fixtures conformance; do
            for path in "$root"/*/; do
              snapshot=${path#"$root"/}
              snapshot=${snapshot%/}
              if [[ "$snapshot" == draft ]]; then
                continue
              fi
              if [[ ! "$snapshot" =~ $exact_semver ]]; then
                echo "::error title=Invalid snapshot directory::$path must use exact MAJOR.MINOR.PATCH"
                exit 1
              fi
              case " ${snapshots[*]-} " in
                *" $snapshot "*) ;;
                *) snapshots+=("$snapshot") ;;
              esac
            done
          done

          for snapshot in "${snapshots[@]-}"; do
            [[ -n "$snapshot" ]] || continue
            python3 tools/check_conformance.py --snapshot "$snapshot"
          done
