name: SDK integration

# No path filters: this status is safe to require on every pull request.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-integration-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Check compatibility scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant contract changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          needed = os.environ['EVENT'] == 'workflow_dispatch'
          if not needed:
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE'] + '...' + os.environ['HEAD'],
              ]).decode().split('\0')
              prefixes = ('spec/', 'schema/', 'fixtures/', 'conformance/', 'interop/', 'tools/')
              workflows = ('.github/workflows/sdk-integration.yml', '.github/workflows/ci.yml', '.github/workflows/sync-sdks.yml')
              needed = any(path.startswith(prefixes) or path in workflows for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('needed=' + str(needed).lower(), file=output)
          PYCODE

  resolve-sdks:
    needs: [scope]
    if: ${{ needs.scope.outputs.needed == 'true' }}
    name: Resolve SDK revisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.resolve.outputs.manifest }}
      python: ${{ steps.resolve.outputs.python }}
      typescript: ${{ steps.resolve.outputs.typescript }}
      go: ${{ steps.resolve.outputs.go }}
      rust: ${{ steps.resolve.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Snapshot SDK commits once for all shards
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/resolve_sdk_revisions.py --output "$RUNNER_TEMP/sdk-revisions.json"
      - name: Upload resolved SDK revisions
        uses: actions/upload-artifact@v4
        with:
          name: sdk-revisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-revisions.json
          if-no-files-found: error
          retention-days: 14

  sdk-integration-shards:
    needs: [resolve-sdks]
    name: SDK integration (${{ matrix.suite-group }})
    strategy:
      fail-fast: false
      matrix:
        suite-group: [core, extended]
    runs-on: ubuntu-latest
    # Expensive step limits total 144 minutes; reserve 6 for setup/reporting.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: agent-hooks-protocol
    steps:
      - name: Check out proposed protocol
        uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - name: Record shared SDK revision snapshot
        env:
          SDK_REVISIONS: ${{ needs.resolve-sdks.outputs.manifest }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"
          printf '%s\n' "$SDK_REVISIONS" > "$GITHUB_WORKSPACE/reports/sdk-revisions.json"
      - name: Check out resolved python SDK
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/python-sdk
          ref: ${{ needs.resolve-sdks.outputs.python }}
          path: python-sdk
          persist-credentials: false
      - name: Check out resolved typescript SDK
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/typescript-sdk
          ref: ${{ needs.resolve-sdks.outputs.typescript }}
          path: typescript-sdk
          persist-credentials: false
      - name: Check out resolved go SDK
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/go-sdk
          ref: ${{ needs.resolve-sdks.outputs.go }}
          path: go-sdk
          persist-credentials: false
      - name: Check out resolved rust SDK
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/rust-sdk
          ref: ${{ needs.resolve-sdks.outputs.rust }}
          path: rust-sdk
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Install harness dependencies and pnpm
        run: |
          python3 -m pip install 'jsonschema[format]>=4.23,<5' 'ruff==0.12.12'
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - name: Regenerate SDKs from proposed protocol
        timeout-minutes: 15
        run: python3 tools/generate_sdk.py --all 2>&1 | tee "$GITHUB_WORKSPACE/reports/generation.log"
      - name: Check generated artifact reproducibility
        run: python3 tools/generate_sdk.py --all --check
      # Each language and the harness still run after another suite fails.
      # Explicit bash enables pipefail; tee must never mask a failing command.
      - name: Install and test Python SDK
        if: ${{ !cancelled() }}
        # 304 tests took 2009s on the hosted runner; bound the process tree
        # before Actions cancels the step, leaving time for cleanup and tee.
        timeout-minutes: 47
        working-directory: python-sdk
        run: |
          timeout --kill-after=30s 45m bash -e -o pipefail -c '
            python3 -m venv .venv
            .venv/bin/python -m pip install -e ".[http,pydantic]" "trio>=0.29,<1"
            .venv/bin/python -m compileall -q src tests
            .venv/bin/python -m unittest discover -s tests
          ' 2>&1 | tee "$GITHUB_WORKSPACE/reports/python-sdk.log"
      - name: Install, build and test TypeScript SDK
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: typescript-sdk
        run: |
          (set -e
            pnpm install --frozen-lockfile
            pnpm build
            pnpm test
          ) 2>&1 | tee "$GITHUB_WORKSPACE/reports/typescript-sdk.log"
      - name: Install, build and test Go SDK
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: go-sdk
        run: |
          (set -e
            go mod download
            go build ./...
            go vet ./...
            go test ./...
          ) 2>&1 | tee "$GITHUB_WORKSPACE/reports/go-sdk.log"
      - name: Build and test Rust SDK
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        working-directory: rust-sdk
        run: |
          (set -e
            cargo build --locked --all-targets --all-features
            cargo test --locked --all-features
          ) 2>&1 | tee "$GITHUB_WORKSPACE/reports/rust-sdk.log"
      - name: Run SDK integration shard
        if: ${{ !cancelled() }}
        # Core made forward progress beyond the former 30-minute deadline.
        timeout-minutes: 42
        run: |
          timeout --kill-after=30s 40m python3 tools/run_sdk_integration.py \
            --sdk-revisions "$GITHUB_WORKSPACE/reports/sdk-revisions.json" \
            --reports-dir "$GITHUB_WORKSPACE/reports" --jobs 4 --suite-group "${{ matrix.suite-group }}" \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/integration.log"
      - name: Upload SDK integration reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk-integration-${{ matrix.suite-group }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  sdk-integration:
    name: SDK integration
    needs: [scope, resolve-sdks, sdk-integration-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every SDK integration shard to succeed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NEEDED: ${{ needs.scope.outputs.needed }}
          RESOLVE_RESULT: ${{ needs.resolve-sdks.result }}
          SHARDS_RESULT: ${{ needs.sdk-integration-shards.result }}
        run: |
          # A failed scope check must never turn into a successful skip.
          test "$SCOPE_RESULT" = success
          if [[ "$NEEDED" == false ]]; then
            test "$RESOLVE_RESULT" = skipped
            test "$SHARDS_RESULT" = skipped
            echo 'No compatibility-relevant changes; SDK integration is not needed.'
          else
            test "$NEEDED" = true
            test "$RESOLVE_RESULT" = success
            test "$SHARDS_RESULT" = success
          fi
