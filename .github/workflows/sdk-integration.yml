name: SDK integration

# No path filters: this status is safe to require on every pull request.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-integration-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Check compatibility scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant contract changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          needed = os.environ['EVENT'] == 'workflow_dispatch'
          if not needed:
              paths = subprocess.check_output([
                  'git', 'diff', '--name-only', '--no-renames', '-z',
                  os.environ['BASE'] + '...' + os.environ['HEAD'],
              ]).decode().split('\0')
              prefixes = ('spec/', 'schema/', 'fixtures/', 'conformance/', 'interop/', 'tools/', '.github/actions/')
              workflows = ('.github/workflows/sdk-integration.yml', '.github/workflows/ci.yml', '.github/workflows/sync-sdks.yml')
              needed = any(path.startswith(prefixes) or path in workflows for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('needed=' + str(needed).lower(), file=output)
          PYCODE

  resolve-sdks:
    needs: [scope]
    if: ${{ needs.scope.outputs.needed == 'true' }}
    name: Resolve SDK revisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.resolve.outputs.manifest }}
      python: ${{ steps.resolve.outputs.python }}
      typescript: ${{ steps.resolve.outputs.typescript }}
      go: ${{ steps.resolve.outputs.go }}
      rust: ${{ steps.resolve.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Snapshot SDK commits once for all shards
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -f tools/sdk-revisions.json ]; then
            args+=(--proposed tools/sdk-revisions.json)
          fi
          python3 tools/resolve_sdk_revisions.py "${args[@]}" --output "$RUNNER_TEMP/sdk-revisions.json"
      - name: Upload resolved SDK revisions
        uses: actions/upload-artifact@v4
        with:
          name: sdk-revisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-revisions.json
          if-no-files-found: error
          retention-days: 14

  generate:
    name: Generate proposed SDK sources
    needs: [resolve-sdks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - uses: ./agent-hooks-protocol/.github/actions/setup-sdk-check
        with:
          revisions: ${{ needs.resolve-sdks.outputs.manifest }}
          role: generate
          sources: 'false'
      - name: Generate and verify reproducibility once
        working-directory: agent-hooks-protocol
        run: |
          python3 tools/generate_sdk.py --all
          python3 tools/generate_sdk.py --all --check
      - name: Package complete generated SDK sources
        run: |
          python3 - <<'PYCODE'
          import subprocess, tarfile
          from pathlib import Path
          with tarfile.open('sources.tar', 'w') as archive:
              for language in ('python', 'typescript', 'go', 'rust'):
                  root = Path(language + '-sdk')
                  files = subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z', '--cached', '--others', '--exclude-standard']).decode().split('\0')
                  for name in sorted(set(files) - {''}):
                      archive.add(root / name, arcname=str(root / name), recursive=False)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-sources-${{ github.run_id }}-${{ github.run_attempt }}
          path: sources.tar
          if-no-files-found: error
          retention-days: 1

  build-runtime:
    name: Build shared integration adapters
    needs: [resolve-sdks, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - uses: ./agent-hooks-protocol/.github/actions/setup-sdk-check
        with:
          revisions: ${{ needs.resolve-sdks.outputs.manifest }}
          role: build
      - name: Build TypeScript runtime
        working-directory: typescript-sdk
        run: pnpm build
      - name: Build Rust lifecycle adapters
        working-directory: rust-sdk
        run: cargo build --locked --features interop --bins
      - name: Build shared Go and Rust interop adapters
        working-directory: agent-hooks-protocol
        run: |
          python3 tools/run_sdk_integration.py --prepare-only \
            --adapter-dir "$GITHUB_WORKSPACE/adapters" \
            --reports-dir "$GITHUB_WORKSPACE/reports" \
            --sdk-revisions "$GITHUB_WORKSPACE/reports/sdk-revisions.json"
      - name: Package runtime artifacts with executable modes
        run: |
          tar -cf runtime.tar adapters \
            typescript-sdk/packages/sdk/dist \
            typescript-sdk/packages/testing/dist \
            typescript-sdk/packages/conformance/dist \
            rust-sdk/target/debug/lifecycle_client \
            rust-sdk/target/debug/lifecycle_server \
            rust-sdk/target/debug/elicitation \
            rust-sdk/target/debug/compaction \
            rust-sdk/target/debug/compaction_wire
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime.tar
          if-no-files-found: error
          retention-days: 1

  python-tests:
    name: Python SDK tests (${{ matrix.shard }})
    needs: [resolve-sdks, generate]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 0 && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - uses: ./agent-hooks-protocol/.github/actions/setup-sdk-check
        with:
          revisions: ${{ needs.resolve-sdks.outputs.manifest }}
          role: python
      - name: Compile and run complete assigned Python test inventory
        working-directory: python-sdk
        env:
          TEST_TIMEOUT: ${{ matrix.shard == 0 && '40m' || '10m' }}
        run: |
          .venv/bin/python -m compileall -q src tests
          timeout --kill-after=30s "$TEST_TIMEOUT" .venv/bin/python ../agent-hooks-protocol/tools/run_unit_shard.py \
            --start-directory tests --shard-index '${{ matrix.shard }}' --shard-count 6 \
            --isolate-test test_content_lifetime.ContentLifetimeTests.test_more_than_4096_calls_release_sources_and_keep_results \
            --report "$GITHUB_WORKSPACE/reports/unit-python-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sdk-report-python-${{ matrix.shard }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  language-tests:
    name: SDK validation (${{ matrix.language }}, ${{ matrix.shard }})
    needs: [resolve-sdks, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: typescript
            shard: 1
          - language: typescript
            shard: 2
          - language: go
            shard: 1
          - language: rust
            shard: 1
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - uses: ./agent-hooks-protocol/.github/actions/setup-sdk-check
        with:
          revisions: ${{ needs.resolve-sdks.outputs.manifest }}
          role: ${{ matrix.language }}
      - name: Build and test TypeScript SDK
        if: ${{ matrix.language == 'typescript' }}
        working-directory: typescript-sdk
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm build
          node --test --test-concurrency=2 --test-shard="$SHARD/2" packages/*/dist/test/*.test.js
          node --test --test-concurrency=2 --test-shard="$SHARD/2" interop/*.test.mjs packages/sdk/test/*.test.mjs
      - name: Build, vet and test Go SDK
        if: ${{ matrix.language == 'go' }}
        working-directory: go-sdk
        run: |
          go mod download
          go build ./...
          go vet ./...
          go test -count=1 -vet=off ./...
      - name: Build and test Rust SDK
        if: ${{ matrix.language == 'rust' }}
        working-directory: rust-sdk
        env:
          AHP_SCHEMA_DIR: ${{ github.workspace }}/agent-hooks-protocol/schema/draft
          AHP_INTEROP_FIXTURE_ROOT: ${{ github.workspace }}/agent-hooks-protocol/interop
        run: |
          cargo build --locked --all-targets --all-features
          cargo test --locked --all-features

  interop-unit:
    name: Interop unit tests (${{ matrix.shard }})
    needs: [resolve-sdks, build-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - uses: ./agent-hooks-protocol/.github/actions/setup-sdk-check
        with:
          revisions: ${{ needs.resolve-sdks.outputs.manifest }}
          role: integration
      - uses: actions/download-artifact@v4
        with:
          name: sdk-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-runtime
      - name: Restore runtime artifacts
        run: tar -xf "$RUNNER_TEMP/sdk-runtime/runtime.tar" -C "$GITHUB_WORKSPACE"
      - name: Run assigned interop unit tests
        working-directory: agent-hooks-protocol/interop
        env:
          AHP_GO_ADAPTER_DIR: ${{ github.workspace }}/adapters
          AHP_RUST_INTEROP: ${{ github.workspace }}/adapters/rust-interop
        run: |
          timeout --kill-after=30s 10m python3 ../tools/run_unit_shard.py --start-directory . --pattern 'test_*.py' \
            --shard-index '${{ matrix.shard }}' --shard-count 3 \
            --duration-file ../tools/ci-interop-durations.json \
            --report "$GITHUB_WORKSPACE/reports/unit-interop-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sdk-report-interop-${{ matrix.shard }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  sdk-integration-shards:
    name: SDK integration (${{ matrix.suite }}, ${{ matrix.shard }})
    needs: [resolve-sdks, build-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: lifecycle, shard: 0, count: 4}
          - {suite: lifecycle, shard: 1, count: 4}
          - {suite: lifecycle, shard: 2, count: 4}
          - {suite: lifecycle, shard: 3, count: 4}
          - {suite: observation, shard: 0, count: 3}
          - {suite: observation, shard: 1, count: 3}
          - {suite: observation, shard: 2, count: 3}
          - {suite: matrix, shard: 0, count: 2}
          - {suite: matrix, shard: 1, count: 2}
          - {suite: catalogue, shard: 0, count: 1}
          - {suite: elicitation, shard: 0, count: 1}
          - {suite: compaction, shard: 0, count: 1}
          - {suite: compaction-wire, shard: 0, count: 1}
          - {suite: auth, shard: 0, count: 1}
          - {suite: sender-isolation, shard: 0, count: 1}
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-hooks-protocol
          persist-credentials: false
      - uses: ./agent-hooks-protocol/.github/actions/setup-sdk-check
        with:
          revisions: ${{ needs.resolve-sdks.outputs.manifest }}
          role: integration
      - uses: actions/download-artifact@v4
        with:
          name: sdk-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-runtime
      - name: Restore runtime artifacts
        run: tar -xf "$RUNNER_TEMP/sdk-runtime/runtime.tar" -C "$GITHUB_WORKSPACE"
      - name: Run complete assigned integration partition
        working-directory: agent-hooks-protocol
        run: |
          python3 tools/run_sdk_integration.py --suite '${{ matrix.suite }}' \
            --shard-index '${{ matrix.shard }}' --shard-count '${{ matrix.count }}' \
            --adapter-dir "$GITHUB_WORKSPACE/adapters" --jobs 4 --timeout 600 \
            --reports-dir "$GITHUB_WORKSPACE/reports" \
            --sdk-revisions "$GITHUB_WORKSPACE/reports/sdk-revisions.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sdk-report-integration-${{ matrix.suite }}-${{ matrix.shard }}
          path: reports/
          if-no-files-found: error
          retention-days: 14

  sdk-integration:
    name: SDK integration
    needs: [scope, resolve-sdks, generate, build-runtime, python-tests, language-tests, interop-unit, sdk-integration-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every SDK check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['scope']['result'] == 'success', 'scope check failed'
          needed = jobs['scope']['outputs']['needed']
          assert needed in ('true', 'false'), 'missing scope decision'
          expected = 'success' if needed == 'true' else 'skipped'
          for name, job in jobs.items():
              if name != 'scope':
                  assert job['result'] == expected, f"{name}: {job['result']} (expected {expected})"
          PYCODE
      - uses: actions/checkout@v5
        if: ${{ needs.scope.outputs.needed == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ needs.scope.outputs.needed == 'true' }}
        with:
          pattern: sdk-report-*
          path: reports
      - name: Verify complete nonduplicated coverage
        if: ${{ needs.scope.outputs.needed == 'true' }}
        run: python3 tools/check_ci_reports.py --reports-dir reports
