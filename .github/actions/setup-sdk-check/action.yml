name: Prepare SDK check
description: Check out one immutable SDK snapshot and prepare only the required toolchains.
inputs:
  revisions:
    description: Resolved SDK revision manifest
    required: true
  role:
    description: generate, build, integration, python, typescript, go, or rust
    required: true
  sources:
    description: Download the generated source artifact
    default: 'true'
runs:
  using: composite
  steps:
    - name: Read SDK revisions
      id: revisions
      shell: bash
      env:
        SDK_REVISIONS: ${{ inputs.revisions }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/reports"
        python3 - <<'PY'
        import json, os, sys
        from pathlib import Path
        sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE'], 'agent-hooks-protocol/tools')))
        from resolve_sdk_revisions import validate_manifest
        manifest = json.loads(os.environ['SDK_REVISIONS'])
        validate_manifest(manifest)
        Path(os.environ['GITHUB_WORKSPACE'], 'reports/sdk-revisions.json').write_text(json.dumps(manifest))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for language, sdk in manifest['sdks'].items():
                print(f"{language}={sdk['revision']}", file=output)
        PY
    - uses: actions/checkout@v5
      with:
        repository: agenthooksprotocol/python-sdk
        ref: ${{ steps.revisions.outputs.python }}
        path: python-sdk
        persist-credentials: false
    - uses: actions/checkout@v5
      with:
        repository: agenthooksprotocol/typescript-sdk
        ref: ${{ steps.revisions.outputs.typescript }}
        path: typescript-sdk
        persist-credentials: false
    - uses: actions/checkout@v5
      with:
        repository: agenthooksprotocol/go-sdk
        ref: ${{ steps.revisions.outputs.go }}
        path: go-sdk
        persist-credentials: false
    - uses: actions/checkout@v5
      with:
        repository: agenthooksprotocol/rust-sdk
        ref: ${{ steps.revisions.outputs.rust }}
        path: rust-sdk
        persist-credentials: false
    - uses: actions/download-artifact@v4
      if: ${{ inputs.sources == 'true' }}
      with:
        name: sdk-sources-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sdk-sources
    - name: Restore generated SDK sources
      if: ${{ inputs.sources == 'true' }}
      shell: bash
      run: tar -xf "$RUNNER_TEMP/sdk-sources/sources.tar" -C "$GITHUB_WORKSPACE"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: python-sdk/pyproject.toml
    - name: Install harness dependencies
      shell: bash
      run: python3 -m pip install 'jsonschema[format]>=4.23,<5' 'ruff==0.12.12'
    - uses: actions/setup-node@v5
      if: ${{ inputs.role == 'generate' || inputs.role == 'build' || inputs.role == 'integration' || inputs.role == 'typescript' }}
      with:
        node-version: '20'
        package-manager-cache: false
    - name: Cache pinned npm formatter
      if: ${{ inputs.role == 'generate' }}
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node20-prettier3.6.2
    - name: Enable pinned pnpm
      if: ${{ inputs.role == 'build' || inputs.role == 'integration' || inputs.role == 'typescript' }}
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.18.3 --activate
    - uses: actions/setup-node@v5
      if: ${{ inputs.role == 'build' || inputs.role == 'integration' || inputs.role == 'typescript' }}
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: typescript-sdk/pnpm-lock.yaml
    - uses: actions/setup-go@v6
      if: ${{ inputs.role == 'generate' || inputs.role == 'build' || inputs.role == 'go' }}
      with:
        go-version: '1.27.x'
        cache-dependency-path: go-sdk/go.sum
    - uses: dtolnay/rust-toolchain@1.88.0
      if: ${{ inputs.role == 'generate' || inputs.role == 'build' || inputs.role == 'rust' }}
      with:
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      if: ${{ inputs.role == 'generate' || inputs.role == 'build' || inputs.role == 'rust' }}
      with:
        workspaces: |
          agent-hooks-protocol/tools/sdk-codegen -> target
          rust-sdk -> target
        shared-key: sdk-${{ inputs.role }}
    - name: Install Python SDK dependencies
      if: ${{ inputs.role == 'python' || inputs.role == 'integration' }}
      shell: bash
      working-directory: python-sdk
      run: |
        python3 -m venv .venv
        .venv/bin/python -m pip install -e '.[http,pydantic]' 'trio>=0.29,<1'
    - name: Install Python test typing dependency
      if: ${{ inputs.role == 'python' }}
      shell: bash
      working-directory: python-sdk
      run: .venv/bin/python -m pip install 'mypy>=1.15,<2'
    - name: Install TypeScript SDK dependencies
      if: ${{ inputs.role == 'build' || inputs.role == 'integration' || inputs.role == 'typescript' }}
      shell: bash
      working-directory: typescript-sdk
      run: pnpm install --frozen-lockfile
